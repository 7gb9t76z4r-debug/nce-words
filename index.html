<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3c72">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NCE 背单词">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>新概念英语 · 背单词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 20px 24px 8px;
    text-align: center;
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    opacity: .9;
  }

  .books {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 14px 0 4px;
    flex-wrap: wrap;
  }

  .books button {
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.08);
    color: #fff;
    padding: 10px 22px;
    min-height: 44px;
    border-radius: 999px;
    font-size: 15px;
    cursor: pointer;
    transition: all .2s;
  }

  .books button:hover { background: rgba(255,255,255,.2); }

  .books button.active {
    background: #fff;
    color: #1e3c72;
    font-weight: 600;
    border-color: #fff;
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 10px 0 4px;
    flex-wrap: wrap;
  }

  .controls button {
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    color: #fff;
    padding: 10px 18px;
    min-height: 44px;
    border-radius: 999px;
    font-size: 15px;
    cursor: pointer;
    transition: all .2s;
  }

  .controls button:hover { background: rgba(255,255,255,.2); }

  .controls button.active {
    background: #ffd166;
    color: #1e3c72;
    border-color: #ffd166;
    font-weight: 600;
  }

  .controls button:disabled { opacity: .35; cursor: default; }

  .card-actions {
    display: flex;
    gap: 16px;
    margin-top: 4px;
  }

  .action-btn {
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    color: #fff;
    border-radius: 14px;
    padding: 14px 24px;
    min-width: 128px;
    min-height: 52px;
    font-size: 17px;
    cursor: pointer;
    transition: all .2s;
  }

  .action-btn:hover { background: rgba(255,255,255,.2); }

  .action-btn.active {
    background: #ffd166;
    color: #1e3c72;
    border-color: #ffd166;
    font-weight: 600;
  }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .card {
    width: min(560px, 88vw);
    min-height: 300px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 20px;
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px 32px;
    cursor: pointer;
    transition: transform .15s, background .3s;
  }

  .card:hover { background: rgba(255,255,255,.16); }
  .card.slide-up   { animation: slideUp .25s ease; }
  .card.slide-down { animation: slideDown .25s ease; }

  @keyframes slideUp {
    from { transform: translateY(36px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes slideDown {
    from { transform: translateY(-36px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  .zh {
    font-size: clamp(24px, 5vw, 38px);
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
  }

  .en-area {
    min-height: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .en {
    font-size: clamp(30px, 6vw, 46px);
    font-weight: 700;
    color: #ffd166;
    letter-spacing: 1px;
    text-align: center;
    animation: fadeIn .3s ease;
  }

  .phonetic {
    font-size: 18px;
    opacity: .75;
    animation: fadeIn .3s ease;
  }

  .speak-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    vertical-align: middle;
    margin-left: 6px;
    opacity: .8;
    transition: opacity .2s, transform .2s;
  }

  .speak-btn:hover { opacity: 1; transform: scale(1.15); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hint {
    font-size: 13px;
    opacity: .45;
  }

  footer {
    width: 100%;
    padding: 10px 24px 22px;
    text-align: center;
  }

  .progress {
    font-size: 14px;
    opacity: .8;
    letter-spacing: 1px;
  }

  .bar {
    width: min(560px, 88vw);
    height: 4px;
    margin: 10px auto 0;
    background: rgba(255,255,255,.15);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: #ffd166;
    border-radius: 2px;
    transition: width .2s;
  }

  .tips {
    margin-top: 10px;
    font-size: 12px;
    opacity: .45;
  }
</style>
</head>
<body>
  <header>
    <h1>新概念英语 · 背单词</h1>
    <div class="books" id="books">
      <button data-book="nce1">第一册</button>
      <button data-book="nce2">第二册</button>
      <button data-book="nce3">第三册</button>
      <button data-book="nce4">第四册</button>
    </div>
    <div class="controls">
      <button id="orderBtn" title="切换乱序 / 顺序"></button>
      <button id="hardOnlyBtn" title="只显示标记过的生词"></button>
      <button id="restoreBtn" title="把本册已掌握的单词加回来"></button>
    </div>
  </header>

  <main>
    <div class="card" id="card">
      <div class="zh" id="zh"></div>
      <div class="en-area" id="enArea"></div>
      <div class="card-actions" id="cardActions">
        <button class="action-btn" id="hardBtn">☆ 生词</button>
        <button class="action-btn" id="masteredBtn">✓ 已掌握</button>
      </div>
      <div class="hint">点击卡片显示英文 · 滚轮 / 滑动切换单词</div>
    </div>
  </main>

  <footer>
    <div class="progress" id="progress"></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="tips">滚轮 / 滑动：切换单词 &nbsp;·&nbsp; 点击 / 轻点卡片：显示或隐藏英文（翻开自动朗读，点 🔊 重听）</div>
  </footer>

  <script src="data/words.js"></script>
  <script>
    const BOOK_NAMES = { nce1: "第一册", nce2: "第二册", nce3: "第三册", nce4: "第四册" };

    // 把按课组织的原始数据摊平成单词列表（保留 id 用于进度和标记）
    const BOOKS = {};
    const RAW = window.NCE_WORDS_RAW || {};
    for (const key of Object.keys(RAW)) {
      const list = [];
      for (const lesson of (RAW[key] && RAW[key].lessons) || []) {
        for (const w of lesson.words || []) {
          list.push({
            id: w.id,
            en: w.word,
            cn: (w.pos ? w.pos + " " : "") + (w.meaning || ""),
            phonetic: Array.isArray(w.phonetic) ? w.phonetic.join(" / ") : (w.phonetic || "")
          });
        }
      }
      BOOKS[key] = list;
    }

    // ---- localStorage 持久化 ----
    const store = {
      get(key, fallback) {
        try {
          const v = localStorage.getItem(key);
          return v === null ? fallback : JSON.parse(v);
        } catch { return fallback; }
      },
      set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
    };

    let book = "nce1";
    let orderMode = store.get("nce.order", "shuffle"); // shuffle | seq
    let hardOnly = store.get("nce.hardOnly", false);
    const hardSets = {};
    const masteredSets = {};
    let words = [];
    let index = 0;
    let revealed = false;

    const cardEl = document.getElementById("card");
    const zhEl = document.getElementById("zh");
    const enAreaEl = document.getElementById("enArea");
    const progressEl = document.getElementById("progress");
    const barFillEl = document.getElementById("barFill");
    const cardActionsEl = document.getElementById("cardActions");
    const hardBtn = document.getElementById("hardBtn");
    const masteredBtn = document.getElementById("masteredBtn");
    const orderBtn = document.getElementById("orderBtn");
    const hardOnlyBtn = document.getElementById("hardOnlyBtn");
    const restoreBtn = document.getElementById("restoreBtn");

    function hardSet(b) {
      if (!hardSets[b]) hardSets[b] = new Set(store.get("nce.hard." + b, []));
      return hardSets[b];
    }
    function masteredSet(b) {
      if (!masteredSets[b]) masteredSets[b] = new Set(store.get("nce.mastered." + b, []));
      return masteredSets[b];
    }
    function saveHard() { store.set("nce.hard." + book, [...hardSet(book)]); }
    function saveMastered() { store.set("nce.mastered." + book, [...masteredSet(book)]); }
    function savePos() {
      const w = words[index];
      if (w) store.set("nce.pos." + book, w.id);
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 按当前设置（已掌握过滤 + 生词模式 + 乱/顺序）生成单词列表
    function buildWords() {
      const base = BOOKS[book] || [];
      const m = masteredSet(book);
      let list = base.filter(w => !m.has(w.id));
      if (hardOnly) {
        const h = hardSet(book);
        list = list.filter(w => h.has(w.id));
      }
      return orderMode === "shuffle" ? shuffle(list) : list;
    }

    // 重建列表并尽量停留在 keepId 这个单词上
    function rebuild(keepId) {
      words = buildWords();
      let i = keepId ? words.findIndex(w => w.id === keepId) : -1;
      if (i < 0) i = Math.min(index, words.length - 1);
      index = Math.max(i, 0);
      revealed = false;
      render();
      updateControls();
    }

    function loadBook(name) {
      book = name;
      document.querySelectorAll("#books button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.book === name);
      });
      index = 0;
      rebuild(store.get("nce.pos." + book, null));
    }

    function emptyMessage() {
      const total = (BOOKS[book] || []).length;
      if (hardOnly && hardSet(book).size === 0)
        return "还没有生词\n点卡片上的「☆ 生词」把难词加进来";
      if (hardOnly) return "生词全部掌握了 🎉";
      if (total > 0 && masteredSet(book).size >= total)
        return "本册单词已全部掌握 🎉\n点上方「恢复已掌握」可重新来过";
      return "本册暂无单词数据";
    }

    function render(direction) {
      const w = words[index];
      if (!w) {
        zhEl.innerHTML = escapeHtml(emptyMessage()).replace(/\n/g, "<br>");
        zhEl.style.fontSize = "20px";
        enAreaEl.innerHTML = "";
        cardActionsEl.style.visibility = "hidden";
        progressEl.textContent = "";
        barFillEl.style.width = "0";
        return;
      }
      zhEl.style.fontSize = "";
      zhEl.textContent = w.cn;
      renderEn(w);
      updateActionButtons(w);
      cardActionsEl.style.visibility = "visible";
      const modeTag = hardOnly ? "生词模式 · " : "";
      progressEl.textContent = `${modeTag}新概念英语${BOOK_NAMES[book]} · 第 ${index + 1} / ${words.length} 词`;
      barFillEl.style.width = ((index + 1) / words.length * 100) + "%";
      savePos();

      if (direction) {
        cardEl.classList.remove("slide-up", "slide-down");
        void cardEl.offsetWidth;
        cardEl.classList.add(direction === "next" ? "slide-up" : "slide-down");
      }
    }

    function updateActionButtons(w) {
      const isHard = hardSet(book).has(w.id);
      hardBtn.classList.toggle("active", isHard);
      hardBtn.textContent = isHard ? "⭐ 生词" : "☆ 生词";
    }

    function updateControls() {
      orderBtn.textContent = orderMode === "shuffle" ? "🔀 乱序" : "📖 顺序";
      hardOnlyBtn.textContent = `⭐ 只考生词 (${hardSet(book).size})`;
      hardOnlyBtn.classList.toggle("active", hardOnly);
      const m = masteredSet(book).size;
      restoreBtn.textContent = `♻️ 恢复已掌握 (${m})`;
      restoreBtn.disabled = m === 0;
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.85;
      speechSynthesis.speak(u);
    }

    function renderEn(w) {
      if (revealed) {
        enAreaEl.innerHTML =
          `<div class="en">${escapeHtml(w.en)} <button class="speak-btn" id="speakBtn" title="朗读">🔊</button></div>` +
          (w.phonetic ? `<div class="phonetic">${escapeHtml(w.phonetic)}</div>` : "");
        document.getElementById("speakBtn").addEventListener("click", e => {
          e.stopPropagation();
          speak(w.en);
        });
      } else {
        enAreaEl.innerHTML = `<div class="hint">？</div>`;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function toggleReveal() {
      if (!words[index]) return;
      revealed = !revealed;
      renderEn(words[index]);
      if (revealed) speak(words[index].en);
    }

    function go(delta, direction) {
      const next = index + delta;
      if (next < 0 || next >= words.length) return;
      index = next;
      revealed = false;
      render(direction);
    }

    // ---- 标记操作 ----
    hardBtn.addEventListener("click", e => {
      e.stopPropagation();
      const w = words[index];
      if (!w) return;
      const h = hardSet(book);
      if (h.has(w.id)) h.delete(w.id); else h.add(w.id);
      saveHard();
      if (hardOnly && !h.has(w.id)) rebuild(w.id); // 生词模式下取消标记，当前词移出列表
      else { render(); updateControls(); }
    });

    masteredBtn.addEventListener("click", e => {
      e.stopPropagation();
      const w = words[index];
      if (!w) return;
      masteredSet(book).add(w.id);
      saveMastered();
      rebuild(w.id); // 当前词被移出，自动显示下一个
    });

    orderBtn.addEventListener("click", () => {
      orderMode = orderMode === "shuffle" ? "seq" : "shuffle";
      store.set("nce.order", orderMode);
      rebuild(words[index] && words[index].id);
    });

    hardOnlyBtn.addEventListener("click", () => {
      hardOnly = !hardOnly;
      store.set("nce.hardOnly", hardOnly);
      rebuild(words[index] && words[index].id);
    });

    restoreBtn.addEventListener("click", () => {
      const m = masteredSet(book);
      if (m.size === 0) return;
      if (!confirm(`恢复本册 ${m.size} 个已掌握的单词？`)) return;
      m.clear();
      saveMastered();
      rebuild(words[index] && words[index].id);
    });

    // 滚轮翻词（加节流，防止一次滚动跳多个）
    let wheelLock = false;
    window.addEventListener("wheel", e => {
      if (wheelLock) return;
      if (Math.abs(e.deltaY) < 10) return;
      wheelLock = true;
      setTimeout(() => wheelLock = false, 260);
      go(e.deltaY > 0 ? 1 : -1, e.deltaY > 0 ? "next" : "prev");
    }, { passive: true });

    // 点击卡片：显示 / 隐藏英文（滑动后的 click 不触发）
    cardEl.addEventListener("click", () => { if (!swiped) toggleReveal(); });

    // 键盘支持
    window.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleReveal(); }
      else if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "PageDown") { go(1, "next"); }
      else if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp") { go(-1, "prev"); }
    });

    // 触屏手势：上滑下一个，下滑上一个，左右滑也可以（轻点翻卡由 click 处理）
    let touchStartX = 0, touchStartY = 0, swiped = false;
    window.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
      swiped = false;
    }, { passive: true });

    window.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return; // 视为轻点，交给 click
      swiped = true;
      setTimeout(() => swiped = false, 350);
      if (Math.abs(dy) >= Math.abs(dx)) go(dy < 0 ? 1 : -1, dy < 0 ? "next" : "prev");
      else go(dx < 0 ? 1 : -1, dx < 0 ? "next" : "prev");
    }, { passive: true });

    // PWA：注册 Service Worker（https 或 localhost 下生效，离线可用）
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    document.getElementById("books").addEventListener("click", e => {
      const btn = e.target.closest("button[data-book]");
      if (btn) loadBook(btn.dataset.book);
    });

    loadBook("nce1");
  </script>
</body>
</html>
