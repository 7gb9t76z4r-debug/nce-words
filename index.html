<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3c72">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NCE 背单词">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>新概念英语 · 背单词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 16px 16px 6px;
    text-align: center;
  }

  header h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 2px;
    opacity: .9;
  }

  .books {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 12px 0 2px;
    flex-wrap: wrap;
  }

  .books button {
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.08);
    color: #fff;
    padding: 10px 22px;
    min-height: 44px;
    border-radius: 999px;
    font-size: 15px;
    cursor: pointer;
    transition: all .2s;
  }

  .books button:hover { background: rgba(255,255,255,.2); }

  .books button.active {
    background: #fff;
    color: #1e3c72;
    font-weight: 600;
    border-color: #fff;
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 10px 0 2px;
    flex-wrap: wrap;
  }

  .controls button, .controls select {
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    color: #fff;
    padding: 10px 16px;
    min-height: 44px;
    border-radius: 999px;
    font-size: 15px;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }

  .controls select { max-width: 46vw; }
  .controls select option { color: #1e3c72; }

  .controls button:hover, .controls select:hover { background: rgba(255,255,255,.2); }

  .controls button.active {
    background: #ffd166;
    color: #1e3c72;
    border-color: #ffd166;
    font-weight: 600;
  }

  .controls button:disabled { opacity: .35; cursor: default; }

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 20;
  }

  .backdrop.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: min(300px, 82vw);
    height: 100%;
    background: rgba(18, 38, 74, .98);
    border-left: 1px solid rgba(255,255,255,.2);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transform: translateX(100%);
    transition: transform .25s ease;
    z-index: 30;
  }

  .drawer.open { transform: translateX(0); }

  .drawer button {
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    color: #fff;
    padding: 14px 18px;
    min-height: 52px;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all .2s;
  }

  .drawer button:hover { background: rgba(255,255,255,.2); }

  .drawer button.active {
    background: #ffd166;
    color: #1e3c72;
    border-color: #ffd166;
    font-weight: 600;
  }

  .drawer button:disabled { opacity: .35; cursor: default; }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-height: 0;
  }

  .card {
    width: min(560px, 92vw);
    min-height: 300px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 20px;
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 36px 28px;
    cursor: pointer;
    transition: transform .15s, background .3s;
  }

  .card:hover { background: rgba(255,255,255,.16); }
  .card.slide-up   { animation: slideUp .25s ease; }
  .card.slide-down { animation: slideDown .25s ease; }

  @keyframes slideUp {
    from { transform: translateY(36px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes slideDown {
    from { transform: translateY(-36px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  .zh {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
  }

  .en-area {
    min-height: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .en {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 700;
    color: #ffd166;
    letter-spacing: 1px;
    text-align: center;
    animation: fadeIn .3s ease;
  }

  .phonetic {
    font-size: 18px;
    opacity: .75;
    animation: fadeIn .3s ease;
  }

  .speak-btn {
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    vertical-align: middle;
    margin-left: 6px;
    opacity: .8;
    transition: opacity .2s, transform .2s;
  }

  .speak-btn:hover { opacity: 1; transform: scale(1.15); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .spell-area {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }

  .spell-area input {
    width: min(360px, 84%);
    padding: 14px 16px;
    font-size: 22px;
    text-align: center;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.12);
    color: #fff;
    outline: none;
    font-family: inherit;
  }

  .spell-area input::placeholder { color: rgba(255,255,255,.4); }
  .spell-area input:focus { border-color: #ffd166; }

  .spell-feedback { min-height: 28px; font-size: 17px; text-align: center; line-height: 1.5; }
  .spell-feedback.ok { color: #7bf1a8; }
  .spell-feedback.bad { color: #ffb3ab; }
  .spell-feedback b { color: #ffd166; }

  .card-actions {
    display: flex;
    gap: 16px;
    margin-top: 2px;
  }

  .action-btn {
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08);
    color: #fff;
    border-radius: 14px;
    padding: 14px 24px;
    min-width: 128px;
    min-height: 52px;
    font-size: 17px;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }

  .action-btn:hover { background: rgba(255,255,255,.2); }

  .action-btn.active {
    background: #ffd166;
    color: #1e3c72;
    border-color: #ffd166;
    font-weight: 600;
  }

  .hint {
    font-size: 13px;
    opacity: .45;
    text-align: center;
  }

  footer {
    width: 100%;
    padding: 8px 24px 20px;
    text-align: center;
  }

  .progress {
    font-size: 14px;
    opacity: .8;
    letter-spacing: 1px;
  }

  .seen {
    font-size: 12px;
    opacity: .5;
    margin-top: 4px;
    min-height: 15px;
  }

  .bar {
    width: min(560px, 88vw);
    height: 4px;
    margin: 8px auto 0;
    background: rgba(255,255,255,.15);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: #ffd166;
    border-radius: 2px;
    transition: width .2s;
  }

  /* 手机端：页头页脚悬浮，卡片相对整个屏幕居中 */
  @media (max-width: 640px) {
    header {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      padding-top: max(10px, env(safe-area-inset-top));
    }

    header h1 { font-size: 16px; }

    .books { padding-top: 8px; gap: 8px; }
    .books button { padding: 8px 16px; font-size: 14px; }

    .controls { padding-top: 8px; }

    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    main { height: 100%; }

    .card {
      min-height: 260px;
      max-height: 62vh;
      padding: 28px 20px;
    }
  }
</style>
</head>
<body>
  <header>
    <h1>新概念英语 · 背单词</h1>
    <div class="books" id="books">
      <button data-book="nce1">第一册</button>
      <button data-book="nce2">第二册</button>
      <button data-book="nce3">第三册</button>
      <button data-book="nce4">第四册</button>
    </div>
    <div class="controls">
      <select id="lessonSel" title="按课学习"></select>
      <button id="menuBtn" title="更多功能">☰ 菜单</button>
    </div>
  </header>

  <div class="backdrop" id="backdrop"></div>
  <div class="drawer" id="drawer">
    <button id="spellBtn" title="拼写测试模式">📝 拼写测试</button>
    <button id="hardOnlyBtn" title="生词复习（按 1/3/7 天间隔出现）"></button>
    <button id="orderBtn" title="切换乱序 / 顺序"></button>
    <button id="shuffleBtn" title="重新打乱当前单词顺序">🎲 打乱</button>
    <button id="restartBtn" title="从第一个单词重新开始">🔁 重头开始</button>
    <button id="restoreBtn" title="把本册已掌握的单词加回来"></button>
  </div>

  <main>
    <div class="card" id="card">
      <div class="zh" id="zh"></div>
      <div class="en-area" id="enArea"></div>
      <div class="spell-area" id="spellArea">
        <input type="text" id="spellInput" placeholder="输入英文单词"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="spell-feedback" id="spellFeedback"></div>
        <button class="action-btn" id="spellSubmit">确定</button>
      </div>
      <div class="card-actions" id="cardActions">
        <button class="action-btn" id="hardBtn">☆ 生词</button>
        <button class="action-btn" id="masteredBtn">✓ 已掌握</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </main>

  <footer>
    <div class="progress" id="progress"></div>
    <div class="seen" id="seenInfo"></div>
    <div class="bar"><i id="barFill"></i></div>
  </footer>

  <script src="data/words.js"></script>
  <script>
    const BOOK_NAMES = { nce1: "第一册", nce2: "第二册", nce3: "第三册", nce4: "第四册" };
    const DAY_MS = 86400000;
    const INTERVALS = [1, 3, 7]; // 艾宾浩斯简易间隔（天）

    // 把按课组织的原始数据摊平（保留 id 和 lessonId），同时记录课文列表
    const BOOKS = {};
    const LESSONS = {};
    const RAW = window.NCE_WORDS_RAW || {};
    for (const key of Object.keys(RAW)) {
      const list = [];
      const lessons = (RAW[key] && RAW[key].lessons) || [];
      LESSONS[key] = lessons.map(l => ({
        lessonId: l.lessonId,
        label: `第${parseInt(l.lessonNumber, 10)}课` + (l.titleEn ? ` ${l.titleEn}` : (l.titleCn ? ` ${l.titleCn}` : ""))
      }));
      for (const lesson of lessons) {
        for (const w of lesson.words || []) {
          list.push({
            id: w.id,
            lessonId: lesson.lessonId,
            en: w.word,
            cn: (w.pos ? w.pos + " " : "") + (w.meaning || ""),
            phonetic: Array.isArray(w.phonetic) ? w.phonetic.join(" / ") : (w.phonetic || "")
          });
        }
      }
      BOOKS[key] = list;
    }

    // ---- localStorage 持久化 ----
    const store = {
      get(key, fallback) {
        try {
          const v = localStorage.getItem(key);
          return v === null ? fallback : JSON.parse(v);
        } catch { return fallback; }
      },
      set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
    };

    let book = "nce1";
    let lessonId = "all";
    let orderMode = store.get("nce.order", "shuffle"); // shuffle | seq
    let hardOnly = store.get("nce.hardOnly", false);
    let spellMode = store.get("nce.spellMode", false);
    const hardSets = {};     // book -> { id: { level, ts } }
    const masteredSets = {}; // book -> Set(id)
    const seenSets = {};     // book -> { id: count }
    let words = [];
    let index = 0;
    let revealed = false;
    let spellWaitingNext = false;

    const cardEl = document.getElementById("card");
    const zhEl = document.getElementById("zh");
    const enAreaEl = document.getElementById("enArea");
    const spellAreaEl = document.getElementById("spellArea");
    const spellInput = document.getElementById("spellInput");
    const spellFeedback = document.getElementById("spellFeedback");
    const spellSubmit = document.getElementById("spellSubmit");
    const hintEl = document.getElementById("hint");
    const progressEl = document.getElementById("progress");
    const seenInfoEl = document.getElementById("seenInfo");
    const barFillEl = document.getElementById("barFill");
    const cardActionsEl = document.getElementById("cardActions");
    const hardBtn = document.getElementById("hardBtn");
    const masteredBtn = document.getElementById("masteredBtn");
    const orderBtn = document.getElementById("orderBtn");
    const hardOnlyBtn = document.getElementById("hardOnlyBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const spellBtn = document.getElementById("spellBtn");
    const lessonSel = document.getElementById("lessonSel");

    // 生词本：{ id: {level, ts} }；旧格式（数组）自动迁移
    function hardSet(b) {
      if (!hardSets[b]) {
        const raw = store.get("nce.hard." + b, {});
        hardSets[b] = Array.isArray(raw)
          ? Object.fromEntries(raw.map(id => [id, { level: 0, ts: 0 }]))
          : raw;
      }
      return hardSets[b];
    }
    function masteredSet(b) {
      if (!masteredSets[b]) masteredSets[b] = new Set(store.get("nce.mastered." + b, []));
      return masteredSets[b];
    }
    function seenSet(b) {
      if (!seenSets[b]) seenSets[b] = store.get("nce.seen." + b, {});
      return seenSets[b];
    }
    function saveHard() { store.set("nce.hard." + book, hardSet(book)); }
    function saveMastered() { store.set("nce.mastered." + book, [...masteredSet(book)]); }
    function saveSeen() { store.set("nce.seen." + book, seenSet(book)); }
    function savePos() {
      const w = words[index];
      if (w) store.set("nce.pos." + book, w.id);
    }
    function bumpSeen(id) {
      const s = seenSet(book);
      s[id] = (s[id] || 0) + 1;
      saveSeen();
    }
    function isDue(e) {
      if (!e || e.ts === 0) return true;
      return Date.now() - e.ts >= INTERVALS[Math.min(e.level, INTERVALS.length - 1)] * DAY_MS;
    }
    function dueCount() {
      const h = hardSet(book);
      return Object.values(h).filter(isDue).length;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 按当前设置（课文 + 已掌握过滤 + 生词复习 + 乱/顺序）生成单词列表
    function buildWords() {
      let list = BOOKS[book] || [];
      if (lessonId !== "all") list = list.filter(w => w.lessonId === lessonId);
      const m = masteredSet(book);
      list = list.filter(w => !m.has(w.id));
      if (hardOnly) {
        const h = hardSet(book);
        list = list.filter(w => h[w.id] && isDue(h[w.id]));
      }
      return orderMode === "shuffle" ? shuffle(list) : list;
    }

    // 重建列表并尽量停留在 keepId 这个单词上
    function rebuild(keepId) {
      words = buildWords();
      let i = keepId ? words.findIndex(w => w.id === keepId) : -1;
      if (i < 0) i = Math.min(index, words.length - 1);
      index = Math.max(i, 0);
      revealed = false;
      render();
      updateControls();
    }

    function fillLessons() {
      lessonSel.innerHTML = `<option value="all">📚 全部课文</option>` +
        (LESSONS[book] || []).map(l =>
          `<option value="${l.lessonId}">${escapeHtml(l.label)}</option>`).join("");
      lessonSel.value = lessonId;
    }

    function loadBook(name) {
      book = name;
      lessonId = store.get("nce.lesson." + book, "all");
      document.querySelectorAll("#books button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.book === name);
      });
      fillLessons();
      index = 0;
      rebuild(store.get("nce.pos." + book, null));
    }

    function emptyMessage() {
      const total = (BOOKS[book] || []).length;
      if (hardOnly) {
        if (Object.keys(hardSet(book)).length === 0)
          return "还没有生词\n点「☆ 生词」或拼写答错会自动加入";
        return "今天该复习的生词都完成啦 🎉\n没到复习时间的会自动出现";
      }
      if (total > 0 && masteredSet(book).size >= total)
        return "本册单词已全部掌握 🎉\n点上方「恢复已掌握」可重新来过";
      if (lessonId !== "all")
        return "本课没有可显示的单词\n（可能都已标记为已掌握）";
      return "本册暂无单词数据";
    }

    function render(direction) {
      const w = words[index];
      if (!w) {
        zhEl.innerHTML = escapeHtml(emptyMessage()).replace(/\n/g, "<br>");
        zhEl.style.fontSize = "19px";
        enAreaEl.innerHTML = "";
        resetSpell();
        cardActionsEl.style.visibility = "hidden";
        spellAreaEl.style.display = "none";
        progressEl.textContent = "";
        seenInfoEl.textContent = "";
        barFillEl.style.width = "0";
        return;
      }
      zhEl.style.fontSize = "";
      zhEl.textContent = w.cn;
      updateActionButtons(w);
      updateSeen(w);
      cardActionsEl.style.visibility = spellMode ? "hidden" : "visible";

      if (spellMode) {
        enAreaEl.style.display = "none";
        spellAreaEl.style.display = "flex";
        resetSpell();
      } else {
        spellAreaEl.style.display = "none";
        enAreaEl.style.display = "flex";
        renderEn(w);
      }
      hintEl.textContent = spellMode
        ? "输入英文后按回车 · 滚轮 / 滑动切换单词"
        : "点击卡片显示英文 · 滚轮 / 滑动切换单词";

      const tags = [];
      if (hardOnly) tags.push("生词复习");
      if (spellMode) tags.push("拼写测试");
      if (lessonId !== "all") {
        const l = (LESSONS[book] || []).find(x => x.lessonId === lessonId);
        if (l) tags.push(l.label.split(" ")[0]);
      }
      progressEl.textContent =
        (tags.length ? tags.join(" · ") + " · " : "") +
        `新概念英语${BOOK_NAMES[book]} · 第 ${index + 1} / ${words.length} 词`;
      barFillEl.style.width = ((index + 1) / words.length * 100) + "%";
      savePos();

      if (direction) {
        cardEl.classList.remove("slide-up", "slide-down");
        void cardEl.offsetWidth;
        cardEl.classList.add(direction === "next" ? "slide-up" : "slide-down");
      }
    }

    function updateSeen(w) {
      seenInfoEl.textContent = `此单词已背过 ${seenSet(book)[w.id] || 0} 遍`;
    }

    function updateActionButtons(w) {
      const isHard = !!hardSet(book)[w.id];
      hardBtn.classList.toggle("active", isHard);
      hardBtn.textContent = isHard ? "⭐ 生词" : "☆ 生词";
      masteredBtn.textContent = hardOnly ? "✓ 记住了" : "✓ 已掌握";
    }

    function updateControls() {
      orderBtn.textContent = orderMode === "shuffle" ? "🔀 乱序" : "📖 顺序";
      const total = Object.keys(hardSet(book)).length;
      hardOnlyBtn.textContent = `⭐ 生词复习 (${dueCount()}/${total})`;
      hardOnlyBtn.classList.toggle("active", hardOnly);
      const m = masteredSet(book).size;
      restoreBtn.textContent = `♻️ 恢复已掌握 (${m})`;
      restoreBtn.disabled = m === 0;
      spellBtn.classList.toggle("active", spellMode);
    }

    // ---- 朗读：优先系统语音，无英文语音时用在线真人发音兜底 ----
    let voices = [];
    function loadVoices() {
      if (!window.speechSynthesis) return;
      voices = speechSynthesis.getVoices();
    }
    loadVoices();
    if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;

    function speak(text) {
      const enVoice = voices.find(v => /^en([_-]|$)/i.test(v.lang));
      if (window.speechSynthesis && enVoice) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = enVoice.lang;
        u.voice = enVoice;
        u.rate = 0.85;
        speechSynthesis.cancel();
        setTimeout(() => speechSynthesis.speak(u), 60); // 兼容 iOS：cancel 后稍延迟再播
      } else {
        // 无系统英文语音（部分手机）：用在线词典真人发音
        const audio = new Audio("https://mp3.91dict.com/word/" + encodeURIComponent(text) + "_a.mp3");
        audio.play().catch(() => {});
      }
    }

    function renderEn(w) {
      if (revealed) {
        enAreaEl.innerHTML =
          `<div class="en">${escapeHtml(w.en)} <button class="speak-btn" id="speakBtn" title="朗读">🔊</button></div>` +
          (w.phonetic ? `<div class="phonetic">${escapeHtml(w.phonetic)}</div>` : "");
        document.getElementById("speakBtn").addEventListener("click", e => {
          e.stopPropagation();
          speak(w.en);
        });
      } else {
        enAreaEl.innerHTML = `<div class="hint">？</div>`;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function toggleReveal() {
      if (spellMode) return;
      const w = words[index];
      if (!w) return;
      revealed = !revealed;
      renderEn(w);
      if (revealed) {
        speak(w.en);
        bumpSeen(w.id);
        updateSeen(w);
      }
    }

    function go(delta, direction) {
      const next = index + delta;
      if (next < 0 || next >= words.length) return;
      index = next;
      revealed = false;
      render(direction);
    }

    // ---- 拼写测试 ----
    function resetSpell() {
      spellWaitingNext = false;
      spellInput.disabled = false;
      spellInput.value = "";
      spellFeedback.textContent = "";
      spellFeedback.className = "spell-feedback";
      spellSubmit.textContent = "确定";
      // 桌面端自动聚焦；手机端不弹键盘，需要时点一下输入框
      if (spellMode && window.matchMedia("(pointer: fine)").matches) spellInput.focus();
    }

    function norm(s) {
      return String(s).trim().toLowerCase().replace(/\s+/g, " ");
    }

    function spellAction() {
      const w = words[index];
      if (!w) return;
      if (spellWaitingNext) {
        spellWaitingNext = false;
        go(1, "next");
        return;
      }
      const ans = norm(spellInput.value);
      if (!ans) return;
      if (ans === norm(w.en)) {
        spellFeedback.className = "spell-feedback ok";
        spellFeedback.textContent = "✓ 正确！";
        bumpSeen(w.id);
        updateSeen(w);
        speak(w.en);
        spellInput.disabled = true;
        const wid = w.id;
        setTimeout(() => {
          if (words[index] && words[index].id === wid && !spellWaitingNext) go(1, "next");
        }, 900);
      } else {
        spellFeedback.className = "spell-feedback bad";
        spellFeedback.innerHTML = `✗ 正确答案：<b>${escapeHtml(w.en)}</b>（已加入生词）`;
        const h = hardSet(book);
        if (!h[w.id]) { h[w.id] = { level: 0, ts: 0 }; saveHard(); updateControls(); }
        speak(w.en);
        spellInput.disabled = true;
        spellSubmit.textContent = "继续";
        spellWaitingNext = true;
      }
    }

    spellSubmit.addEventListener("click", e => { e.stopPropagation(); spellAction(); });
    spellInput.addEventListener("click", e => e.stopPropagation());
    spellInput.addEventListener("keydown", e => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); spellAction(); }
    });

    // ---- 标记操作 ----
    hardBtn.addEventListener("click", e => {
      e.stopPropagation();
      const w = words[index];
      if (!w) return;
      const h = hardSet(book);
      if (h[w.id]) delete h[w.id]; else h[w.id] = { level: 0, ts: 0 };
      saveHard();
      if (hardOnly && !h[w.id]) rebuild(w.id); // 生词复习中取消标记，当前词移出列表
      else { render(); updateControls(); }
    });

    masteredBtn.addEventListener("click", e => {
      e.stopPropagation();
      const w = words[index];
      if (!w) return;
      if (hardOnly) {
        // 生词复习：记住了 → 间隔延长（1天→3天→7天→毕业）
        const h = hardSet(book);
        const entry = h[w.id];
        if (entry) {
          if (entry.level >= INTERVALS.length - 1) delete h[w.id]; // 完成 7 天复习，毕业
          else { entry.level += 1; entry.ts = Date.now(); }
          saveHard();
        }
        rebuild(w.id);
      } else {
        masteredSet(book).add(w.id);
        saveMastered();
        rebuild(w.id); // 当前词被移出，自动显示下一个
      }
    });

    orderBtn.addEventListener("click", () => {
      orderMode = orderMode === "shuffle" ? "seq" : "shuffle";
      store.set("nce.order", orderMode);
      rebuild(words[index] && words[index].id);
    });

    document.getElementById("shuffleBtn").addEventListener("click", () => {
      orderMode = "shuffle";
      store.set("nce.order", orderMode);
      rebuild(words[index] && words[index].id);
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      index = 0;
      rebuild(null);
    });

    hardOnlyBtn.addEventListener("click", () => {
      hardOnly = !hardOnly;
      store.set("nce.hardOnly", hardOnly);
      rebuild(words[index] && words[index].id);
    });

    restoreBtn.addEventListener("click", () => {
      const m = masteredSet(book);
      if (m.size === 0) return;
      if (!confirm(`恢复本册 ${m.size} 个已掌握的单词？`)) return;
      m.clear();
      saveMastered();
      rebuild(words[index] && words[index].id);
    });

    spellBtn.addEventListener("click", () => {
      spellMode = !spellMode;
      store.set("nce.spellMode", spellMode);
      revealed = false;
      render();
      updateControls();
    });

    lessonSel.addEventListener("change", () => {
      lessonId = lessonSel.value;
      store.set("nce.lesson." + book, lessonId);
      index = 0;
      rebuild(words[index] && words[index].id);
    });

    // ---- 侧边抽屉菜单 ----
    const drawerEl = document.getElementById("drawer");
    const backdropEl = document.getElementById("backdrop");
    function setDrawer(open) {
      drawerEl.classList.toggle("open", open);
      backdropEl.classList.toggle("open", open);
    }
    document.getElementById("menuBtn").addEventListener("click", () => setDrawer(true));
    backdropEl.addEventListener("click", () => setDrawer(false));
    drawerEl.addEventListener("click", e => {
      if (e.target.closest("button")) setTimeout(() => setDrawer(false), 180);
    });

    // 滚轮翻词（加节流，防止一次滚动跳多个）
    let wheelLock = false;
    window.addEventListener("wheel", e => {
      if (wheelLock) return;
      if (Math.abs(e.deltaY) < 10) return;
      wheelLock = true;
      setTimeout(() => wheelLock = false, 260);
      go(e.deltaY > 0 ? 1 : -1, e.deltaY > 0 ? "next" : "prev");
    }, { passive: true });

    // 点击卡片：显示 / 隐藏英文（滑动后的 click 不触发；拼写模式下不翻卡）
    cardEl.addEventListener("click", () => { if (!swiped && !spellMode) toggleReveal(); });

    // 键盘支持
    window.addEventListener("keydown", e => {
      if (e.target === spellInput) return; // 输入框有自己的按键处理
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!spellMode) toggleReveal(); }
      else if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "PageDown") { go(1, "next"); }
      else if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp") { go(-1, "prev"); }
    });

    // 触屏手势：上滑下一个，下滑上一个，左右滑也可以（轻点翻卡由 click 处理）
    let touchStartX = 0, touchStartY = 0, swiped = false, gestureSkip = false;
    window.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
      swiped = false;
      gestureSkip = !!e.target.closest("#drawer, select, input");
    }, { passive: true });

    window.addEventListener("touchend", e => {
      if (gestureSkip) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return; // 视为轻点，交给 click
      swiped = true;
      setTimeout(() => swiped = false, 350);
      if (Math.abs(dy) >= Math.abs(dx)) go(dy < 0 ? 1 : -1, dy < 0 ? "next" : "prev");
      else go(dx < 0 ? 1 : -1, dx < 0 ? "next" : "prev");
    }, { passive: true });

    // PWA：注册 Service Worker（https 或 localhost 下生效，离线可用）
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    document.getElementById("books").addEventListener("click", e => {
      const btn = e.target.closest("button[data-book]");
      if (btn) loadBook(btn.dataset.book);
    });

    loadBook("nce1");
  </script>
</body>
</html>
